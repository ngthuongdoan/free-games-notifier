name: Redeploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  redeploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update Pages deploy marker
        run: |
          node -e "const fs=require('fs'); const path='docs/deploy.json'; fs.writeFileSync(path, JSON.stringify({ redeployedAt: new Date().toISOString() }, null, 2) + '\n');"

      - name: Commit deploy marker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/deploy.json
          git commit -m "Trigger GitHub Pages redeploy" || exit 0
          git push
