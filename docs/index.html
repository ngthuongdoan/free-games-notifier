<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free Games Notifier</title>
  <meta
    name="description"
    content="Sign up for Free Games Notifier with your email and personal Steam price limit."
  >
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="#top" aria-label="Free Games Notifier home">
        <span class="brand-mark" aria-hidden="true">FG</span>
        <span class="brand-text">Free Games Notifier</span>
      </a>
      <nav class="header-links" aria-label="Primary">
        <a
          href="https://github.com/ngthuongdoan/free-games-notifier"
          target="_blank"
          rel="noreferrer"
        >
          View on GitHub
        </a>
      </nav>
    </header>

    <main id="top">
      <section class="form-layout" id="register">
        <section class="signup-card" aria-labelledby="register-title">
          <div class="card-header">
            <p class="eyebrow">Registration</p>
            <h1 id="register-title">Sign up for free game alerts</h1>
            <p>
              Add your email and choose your Steam budget limit. We will only
              send Steam deals that match your price range.
            </p>
          </div>

          <form id="registration-form" novalidate>
            <label class="field">
              <span>Email address</span>
              <input
                id="email"
                name="email"
                type="email"
                autocomplete="email"
                placeholder="you@example.com"
                required
              >
            </label>

            <label class="field">
              <span>Steam price limit (VND)</span>
              <input
                id="steamMaxPriceVnd"
                name="steamMaxPriceVnd"
                type="number"
                inputmode="numeric"
                min="1000"
                step="1000"
                placeholder="200000"
                required
              >
            </label>

            <label class="field">
              <span>Subscriber list</span>
              <select id="listName" name="listName">
                <option value="daily-free-games">daily-free-games</option>
                <option value="weekly-summary">weekly-summary</option>
              </select>
            </label>

            <button class="primary-button" type="submit">Send my registration</button>
          </form>

          <div id="form-status" class="form-status" aria-live="polite"></div>

          <div class="card-note">
            Your signup request will be reviewed before alerts start.
          </div>
        </section>
      </section>
    </main>
  </div>

  <script src="./site-config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
